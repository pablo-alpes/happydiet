name: HappyDiet
options:
  bundleIdPrefix: com.happydiet
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

targets:
  HappyDiet:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HappyDiet
        type: group
        excludes:
          - "*.xcassets"
          - "HappyDietConfig.plist"
          - "Info.plist"
    resources:
      - path: HappyDiet/Assets.xcassets
      - path: HappyDiet/HappyDietConfig.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.happydiet.app
        PRODUCT_NAME: HappyDiet
        INFOPLIST_FILE: HappyDiet/Info.plist
        CODE_SIGN_STYLE: Automatic
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/Frameworks
        SWIFT_OBJC_BRIDGING_HEADER: HappyDiet/HappyDiet-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        # Device (iphoneos): enable HeyCyan BLE — QCSDK is a static framework, linked but NOT embedded
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos*]": "$(inherited) HEYCYAN_SDK_LINKED"
        "GCC_PREPROCESSOR_DEFINITIONS[sdk=iphoneos*]": "$(inherited) HEYCYAN_SDK_LINKED=1"
        "OTHER_LDFLAGS[sdk=iphoneos*]": ["-framework", "QCSDK"]
        # Simulator: exclude QCSDK ObjC files (they import device-only framework headers)
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=iphonesimulator*]": "QCCentralManager.m QCScanViewController.m QCScanView.m"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
    preBuildScripts:
      - script: |
          PLIST="$SRCROOT/HappyDiet/HappyDietConfig.plist"
          PORT=8080
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then
            URL="http://localhost:$PORT"
          else
            IP=$(ipconfig getifaddr en0 2>/dev/null || ipconfig getifaddr en1 2>/dev/null)
            if [ -z "$IP" ]; then
              echo "warning: Could not detect Mac IP — using localhost"
              URL="http://localhost:$PORT"
            else
              URL="http://$IP:$PORT"
            fi
          fi
          /usr/libexec/PlistBuddy -c "Set :BACKEND_URL $URL" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :BACKEND_URL string $URL" "$PLIST"
          echo "Backend URL set to $URL (platform: $PLATFORM_NAME)"
        name: "Auto-detect backend URL"
        basedOnDependencyAnalysis: false
