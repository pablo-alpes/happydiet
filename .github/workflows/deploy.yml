# HappyDiet CI/CD — Deploy backend to Cloud Run
# Triggers: push to main (prod), push to dev (dev), PRs (test only), manual (workflow_dispatch)
#
# REQUIRED: Add these secrets in Settings → Secrets and variables → Actions:
#   GCP_PROJECT_ID = happydiet-1-490118 (or your project ID)
#   GCP_SA_KEY    = full JSON of service account key (run ./scripts/bootstrap-cloud.sh to create)
#
# Environments:
#   dev  — happydiet-backend-dev (from dev branch)
#   prod — happydiet-backend (from main branch)
#
# Tests must pass before any deployment.
# Deploy uses gcloud builds submit — build runs in GCP, more reliable than runner-side deploy.
name: Deploy to Cloud Run

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - dev

env:
  REGION: us-central1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm run test:ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/test-results/
          retention-days: 7

  deploy-dev:
    name: Deploy to Dev
    needs: test
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy via Cloud Build (dev)
        run: |
          gcloud builds submit \
            --config cloudbuild.yaml \
            --substitutions=_SERVICE_NAME=happydiet-backend-dev,_REGION=${{ env.REGION }},_ENV=dev \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            .

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe happydiet-backend-dev \
            --region ${{ env.REGION }} \
            --format 'value(status.url)' \
            --project ${{ secrets.GCP_PROJECT_ID }})
          curl -sf "$URL/health" || exit 1
          echo "Health check passed."

  deploy-prod:
    name: Deploy to Prod
    needs: test
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy via Cloud Build (prod)
        run: |
          gcloud builds submit \
            --config cloudbuild.yaml \
            --substitutions=_SERVICE_NAME=happydiet-backend,_REGION=${{ env.REGION }},_ENV=prod \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            .

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe happydiet-backend \
            --region ${{ env.REGION }} \
            --format 'value(status.url)' \
            --project ${{ secrets.GCP_PROJECT_ID }})
          curl -sf "$URL/health" || exit 1
          echo "Health check passed."
