# HappyDiet CI/CD - tests before deploy (test:ci produces JUnit report)
# If tests fail, deploy step does not run.
# Run from repo root: gcloud builds submit --config cloudbuild.yaml .
# Or: gcloud builds submit --config cloudbuild.yaml --substitutions=_SERVICE_NAME=happydiet-backend-dev .
# Cloud Build provides PROJECT_ID automatically.
substitutions:
  _REGION: us-central1
  _SERVICE_NAME: happydiet-backend
  _ENV: prod
steps:
  - name: 'node:20'
    entrypoint: npm
    args: ['ci']
    dir: 'backend'
  - name: 'node:20'
    id: 'test'
    entrypoint: npm
    args: ['run', 'test:ci']
    dir: 'backend'
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy'
    waitFor: ['test']
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--source'
      - '.'
      - '--region'
      - '${_REGION}'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_REGION},ENV=${_ENV}'
    dir: 'backend'
