name: HappyDiet
options:
  bundleIdPrefix: com.happydiet
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

targets:
  HappyDiet:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      - framework: Frameworks/QCSDK.framework
        embed: true
    sources:
      - path: HappyDiet
        type: group
        excludes:
          - "*.xcassets"
          - "HappyDietConfig.plist"
          - "Info.plist"
    resources:
      - path: HappyDiet/Assets.xcassets
      - path: HappyDiet/HappyDietConfig.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.happydiet.app
        PRODUCT_NAME: HappyDiet
        INFOPLIST_FILE: HappyDiet/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: M7W9HYCCHN
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/Frameworks
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
