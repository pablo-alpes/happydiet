name: HappyDiet
options:
  bundleIdPrefix: com.happydiet
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

targets:
  HappyDiet:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HappyDiet
        type: group
        excludes:
          - "*.xcassets"
          - "HappyDietConfig.plist"
          - "Info.plist"
    resources:
      - path: HappyDiet/Assets.xcassets
      - path: HappyDiet/HappyDietConfig.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.happydiet.app
        PRODUCT_NAME: HappyDiet
        INFOPLIST_FILE: HappyDiet/Info.plist
        CODE_SIGN_STYLE: Automatic
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/Frameworks
        SWIFT_OBJC_BRIDGING_HEADER: HappyDiet/HappyDiet-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        # Device (iphoneos): enable HeyCyan BLE via QCSDK
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos*]": "$(inherited) HEYCYAN_SDK_LINKED"
        "GCC_PREPROCESSOR_DEFINITIONS[sdk=iphoneos*]": "$(inherited) HEYCYAN_SDK_LINKED=1"
        "OTHER_LDFLAGS[sdk=iphoneos*]": ["-framework", "QCSDK"]
        # Simulator: exclude QCSDK ObjC files (they import device-only framework headers)
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=iphonesimulator*]": "QCCentralManager.m QCScanViewController.m QCScanView.m"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
    postCompileScripts:
      - script: |
          if [ "$PLATFORM_NAME" = "iphoneos" ]; then
            DEST="$BUILT_PRODUCTS_DIR/$FRAMEWORKS_FOLDER_PATH"
            mkdir -p "$DEST"
            cp -R "$SRCROOT/Frameworks/QCSDK.framework" "$DEST/"
            if [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
              codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$DEST/QCSDK.framework"
            fi
          fi
        name: "Embed QCSDK (device only)"
        basedOnDependencyAnalysis: false
